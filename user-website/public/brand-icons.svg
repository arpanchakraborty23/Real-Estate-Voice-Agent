<svg xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- House -->
  <symbol id="icon-house" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10L12 3l9 7" />
    <path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9" />
    <rect x="10" y="14" width="4" height="6" rx="0.5" />
  </symbol>

  <!-- Building -->
  <symbol id="icon-building" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="16" height="17" rx="1" />
    <line x1="4" y1="12" x2="20" y2="12" />
    <rect x="8" y="14" width="3" height="3" rx="0.5" />
    <rect x="13" y="14" width="3" height="3" rx="0.5" />
    <rect x="8" y="7" width="3" height="3" rx="0.5" />
    <rect x="13" y="7" width="3" height="3" rx="0.5" />
  </symbol>

  <!-- Phone -->
  <symbol id="icon-phone" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 16.92v3a1.92 1.92 0 0 1-2.09 1.96 18.94 18.94 0 0 1-8.28-2.93 18.72 18.72 0 0 1-5.77-5.77A18.94 18.94 0 0 1 2.12 4.1 1.92 1.92 0 0 1 4.07 2h3a1.92 1.92 0 0 1 1.93 1.65 12.12 12.12 0 0 0 .66 2.56 1.92 1.92 0 0 1-.43 2.03l-1.26 1.27a15.33 15.33 0 0 0 5.77 5.77l1.27-1.27a1.92 1.92 0 0 1 2.03-.43 12.12 12.12 0 0 0 2.56.66A1.92 1.92 0 0 1 22 16.92z" />
  </symbol>

  <!-- Mail -->
  <symbol id="icon-mail" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="5" width="20" height="14" rx="2" />
    <path d="M2 7l10 6 10-6" />
  </symbol>

  <!-- Map Pin -->
  <symbol id="icon-map-pin" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2a8 8 0 0 0-8 8c0 5.33 8 12 8 12s8-6.67 8-12a8 8 0 0 0-8-8z" />
    <circle cx="12" cy="10" r="3" />
  </symbol>

  <!-- Star -->
  <symbol id="icon-star" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
  </symbol>

  <!-- Search -->
  <symbol id="icon-search" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8" />
    <line x1="21" y1="21" x2="16.65" y2="16.65" />
  </symbol>

  <!-- Mic -->
  <symbol id="icon-mic" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="2" width="6" height="11" rx="3" />
    <path d="M5 10a7 7 0 0 0 14 0" />
    <line x1="12" y1="19" x2="12" y2="22" />
  </symbol>

  <!-- Chat -->
  <symbol id="icon-chat" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
    <line x1="8" y1="9" x2="16" y2="9" />
    <line x1="8" y1="13" x2="13" y2="13" />
  </symbol>

  <!-- Image / Gallery -->
  <symbol id="icon-image" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2" />
    <circle cx="8.5" cy="8.5" r="1.5" />
    <path d="M21 15l-5-5L5 21" />
  </symbol>

  <!-- Users / Team -->
  <symbol id="icon-users" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
    <circle cx="9" cy="7" r="4" />
    <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
  </symbol>

  <!-- Check -->
  <symbol id="icon-check" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 6 9 17 4 12" />
  </symbol>

  <!-- Arrow Right -->
  <symbol id="icon-arrow-right" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="5" y1="12" x2="19" y2="12" />
    <polyline points="12 5 19 12 12 19" />
  </symbol>

  <!-- Heart -->
  <symbol id="icon-heart" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
  </symbol>

  <!-- Home (alt, roof-only) -->
  <symbol id="icon-home-alt" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10l9-7 9 7" />
    <path d="M5 9v10a1 1 0 0 0 1 1h3v-5h6v5h3a1 1 0 0 0 1-1V9" />
  </symbol>

  <!-- Close / X -->
  <symbol id="icon-close" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="18" y1="6" x2="6" y2="18" />
    <line x1="6" y1="6" x2="18" y2="18" />
  </symbol>

  <!-- Menu / Hamburger -->
  <symbol id="icon-menu" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="6" x2="21" y2="6" />
    <line x1="3" y1="12" x2="21" y2="12" />
    <line x1="3" y1="18" x2="21" y2="18" />
  </symbol>
</svg>
