name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-voice-agent:
    name: Lint Voice Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-Agent

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check lint
        run: uv run ruff check .

  lint-rag-api:
    name: Lint RAG API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check lint
        run: uv run ruff check .

  test-rag-api:
    name: Test RAG API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  test-voice-agent:
    name: Test Voice Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-Agent

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run pytest
